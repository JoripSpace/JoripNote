# joripspace-workflow-version: 8
name: JoripSpace Deploy "(build_connection_8a38404362500ef1bbceb8ea)"

on:
  push:
    branches:
      - "demo"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: "joripspace-joripnote-build_connection_8a38404362500ef1bbceb8ea"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=JoripSpace build failed::Build failed at line $LINENO (exit $code)"; exit "$code"' ERR
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          rm -rf .joripspace-artifact
          mkdir -p .joripspace-artifact
          # Bundle the editor engine and fflate into the standalone Worker artifact.
          # Copy only the verified build output so personal/dev files never enter the archive.
          cp dist/worker.js .joripspace-artifact/worker.js
          echo "Deploy artifact files:"
          find .joripspace-artifact -type f -print
      - name: Deploy to JoripSpace
        shell: bash
        env:
          JORIPSPACE_PROJECT_ID: "joripnote"
          JORIPSPACE_CONNECTION_ID: "build_connection_8a38404362500ef1bbceb8ea"
          JORIPSPACE_ARTIFACT_PATH: ".joripspace-artifact"
          JORIPSPACE_ENTRYPOINT: "worker.js"
          JORIPSPACE_API_URL: "https://api.joripspace.com"
        run: |
          set -euo pipefail
          source_dir="$JORIPSPACE_ARTIFACT_PATH"
          if [[ ! -d "$source_dir" ]]; then
            echo "::error title=JoripSpace artifact preparation failed::JoripSpace artifact directory does not exist: $source_dir" >&2
            exit 1
          fi
          stage_dir="$RUNNER_TEMP/joripspace-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive_path="$RUNNER_TEMP/joripspace-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.zip"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          cp -R "$source_dir"/. "$stage_dir"/
          JORIPSPACE_STAGE_DIR="$stage_dir" node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            import { join } from "node:path";
            const root = process.env.JORIPSPACE_STAGE_DIR;
            const entrypoint = process.env.JORIPSPACE_ENTRYPOINT;
            await writeFile(join(root, ".joripspace-deploy.json"), JSON.stringify({ entrypoint }) + "\n");
          '
          (cd "$stage_dir" && find . -type f -exec zip -q "$archive_path" -- {} +)
          JORIPSPACE_ARCHIVE_PATH="$archive_path" node --input-type=module <<'JORIPSPACE_SCRIPT'
          async function inlineDeployMain() {
            const { open: open2 } = await import("node:fs/promises");
            const audience = "https://api.joripspace.com/v1/external-builds/github";
            const projectId = requiredEnv("JORIPSPACE_PROJECT_ID");
            const connectionId = String(process.env.JORIPSPACE_CONNECTION_ID || "").trim();
            const archivePath = requiredEnv("JORIPSPACE_ARCHIVE_PATH");
            const apiUrl = requiredEnv("JORIPSPACE_API_URL").replace(/\/+$/, "");
            const oidcToken = await requestOidcToken();
            const create2 = await api(`/v1/projects/${encodeURIComponent(projectId)}/checkpoint-uploads`, {
              method: "POST",
              token: oidcToken,
              json: { source_type: "deployment" }
            });
            const file2 = await open2(archivePath, "r");
            try {
              const chunkSize = Number(create2.chunk_size || 8 * 1024 * 1024);
              const buffer = Buffer.alloc(chunkSize);
              let partNumber = 1;
              let position = 0;
              while (true) {
                const { bytesRead } = await file2.read(buffer, 0, buffer.length, position);
                if (bytesRead === 0) break;
                const partPath = String(create2.upload_part_url_template).replace("{part_number}", String(partNumber));
                await api(partPath, {
                  method: "PUT",
                  token: oidcToken,
                  body: buffer.subarray(0, bytesRead),
                  contentType: "application/octet-stream"
                });
                position += bytesRead;
                partNumber += 1;
              }
              if (position === 0) throw new Error("Build artifact ZIP is empty.");
            } finally {
              await file2.close();
            }
            await api(create2.complete_url, { method: "POST", token: oidcToken, json: {} });
            const deployPath = `/v1/projects/${encodeURIComponent(projectId)}/checkpoints/${encodeURIComponent(create2.checkpoint_id)}/deploy`;
            for (let attempt = 1; attempt <= 150; attempt += 1) {
              const deployToken = await requestOidcToken();
              const result = await api(deployPath, {
                method: "POST",
                token: deployToken,
                json: {},
                allowedStatuses: [404, 409]
              });
              if (!result.__retry) {
                for (const warning of result.warnings || []) {
                  process.stdout.write(
                    `::warning title=JoripSpace security::${escapeWorkflowCommand(warning.message)}
          `
                  );
                }
                process.stdout.write(
                  `JoripSpace deployment succeeded: ${result.url || result.default_url || result.deployment_id || projectId}
          `
                );
                return;
              }
              if (!["checkpoint_not_found", "checkpoint_not_ready", "external_build_deploy_busy"].includes(
                result.error?.code
              )) {
                throw apiError(result.__status, result);
              }
              await new Promise((resolve) => setTimeout(resolve, 2e3));
            }
            throw new Error("JoripSpace artifact processing did not finish within 5 minutes.");
            function escapeWorkflowCommand(value) {
              return String(value || "").replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
            }
            __name(escapeWorkflowCommand, "escapeWorkflowCommand");
            async function requestOidcToken() {
              const requestUrl = requiredEnv("ACTIONS_ID_TOKEN_REQUEST_URL");
              const requestToken = requiredEnv("ACTIONS_ID_TOKEN_REQUEST_TOKEN");
              const separator = requestUrl.includes("?") ? "&" : "?";
              const response = await fetch(`${requestUrl}${separator}audience=${encodeURIComponent(audience)}`, {
                headers: { Authorization: `Bearer ${requestToken}` }
              });
              const payload = await response.json().catch(() => ({}));
              if (!response.ok || typeof payload.value !== "string") {
                throw new Error(`GitHub OIDC token request failed (${response.status}).`);
              }
              return payload.value;
            }
            __name(requestOidcToken, "requestOidcToken");
            async function api(path, options) {
              const url = path.startsWith("http") ? path : `${apiUrl}${path}`;
              const headers = new Headers({
                Authorization: `Bearer ${options.token}`,
                Accept: "application/json"
              });
              if (connectionId) headers.set("X-JoripSpace-Connection-ID", connectionId);
              let body = options.body;
              if (options.json !== void 0) {
                headers.set("Content-Type", "application/json");
                body = JSON.stringify(options.json);
              } else if (options.contentType) {
                headers.set("Content-Type", options.contentType);
              }
              const response = await fetch(url, { method: options.method, headers, body });
              const text3 = await response.text();
              const payload = text3 ? safeJson(text3) : {};
              if (response.ok) return payload;
              if ((options.allowedStatuses || []).includes(response.status)) {
                return { ...payload, __retry: true, __status: response.status };
              }
              throw apiError(response.status, payload);
            }
            __name(api, "api");
            function apiError(status, payload) {
              const error3 = new Error(payload?.error?.message || `JoripSpace request failed (${status}).`);
              error3.code = payload?.error?.code || "joripspace_request_failed";
              const diagnostic = JSON.stringify({ http_status: status, code: error3.code, message: error3.message, details: payload?.error?.details || null }).replace(/((?:authorization|[\w-]*(?:key|token|secret|password|credential)[\w-]*)["']?\s*[:=]\s*["']?)[^"'\s,}]+/gi, "$1[REDACTED]").replace(/Bearer\s+[^\s"']+/gi, "Bearer [REDACTED]").slice(0, 16e3);
              console.error(`JORIPSPACE_DIAGNOSTIC ${diagnostic}`);
              return error3;
            }
            __name(apiError, "apiError");
            function safeJson(value) {
              try {
                return JSON.parse(value);
              } catch {
                return { error: { code: "invalid_response", message: value.slice(0, 500) } };
              }
            }
            __name(safeJson, "safeJson");
            function requiredEnv(name) {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is required.`);
              return value;
            }
            __name(requiredEnv, "requiredEnv");
          }
          
          await inlineDeployMain();
          JORIPSPACE_SCRIPT
